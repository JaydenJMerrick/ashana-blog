name: Process Post and Deploy Site

on:
  repository_dispatch:
    types: [create-blog-post]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Only create a post if triggered by the form dispatch event
      - name: Create New .qmd File from Event Payload
        if: github.event_name == 'repository_dispatch'
        run: |
          TITLE="${{ github.event.client_payload.title }}"
          BODY="${{ github.event.client_payload.body }}"
          TAG="${{ github.event.client_payload.tag }}"
          
          # Convert tag to folder slug (e.g., 'Shower Thoughts' -> 'shower-thoughts')
          SLUG=$(echo "$TAG" | tr '[:upper:]' '[:lower:]' | tr ' ' '-')
          FILENAME="posts/$SLUG/post-$(date +%s).qmd"
          
          mkdir -p "posts/$SLUG"
          
          cat <<EOF > "$FILENAME"
          ---
          title: "$TITLE"
          date: "$(date +%Y-%m-%d)"
          categories: ["$TAG"]
          ---

          $BODY
          EOF

      # Only commit if a new post file was actually staged
      - name: Commit New Post to Repository
        if: github.event_name == 'repository_dispatch'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add posts/
          git diff --staged --quiet || git commit -m "Add new blog post via site form"
          git push

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto Site
        uses: quarto-dev/quarto-actions/render@v2

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
